<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>修改初始密码 · Team Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <h1>修改初始密码</h1>
    <p class="muted">为保护账号，请设置自己的密码后再继续使用。</p>
    <form id="passwordForm" class="form">
      <label>当前临时密码<input type="password" name="old_password" autocomplete="current-password" maxlength="128" required /></label>
      <label>新密码（12–128 位）<input type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="128" required /></label>
      <label>确认新密码<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" maxlength="128" required /></label>
      <div id="passwordError" class="form-error" hidden></div>
      <button class="btn primary" type="submit">保存并继续</button>
      <button class="btn ghost" type="button" id="logout">退出登录</button>
    </form>
  </main>
  <script src="/js/change-password.js"></script>
</body>
</html>
