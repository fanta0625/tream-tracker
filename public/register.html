<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>邮箱注册 · Team Tracker</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-page">
  <main class="login-card register-card">
    <div class="login-brand">
      <span class="brand-mark">TT</span>
      <div>
        <strong>Team Tracker</strong>
        <span>团队工作追踪</span>
      </div>
    </div>
    <h1>邮箱注册</h1>
    <p class="muted">验证邮箱后提交注册，管理员审核通过后才能登录。</p>
    <form id="registerForm" class="form">
      <label>邮箱
        <input type="email" name="email" autocomplete="email" required />
      </label>
      <div class="code-row">
        <label>验证码
          <input name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required />
        </label>
        <button class="btn ghost" type="button" id="sendCodeBtn">发送验证码</button>
      </div>
      <label>姓名 / 显示名
        <input name="display_name" placeholder="例如：张三" required />
      </label>
      <label>密码
        <input type="password" name="password" minlength="6" autocomplete="new-password" required />
      </label>
      <label>确认密码
        <input type="password" name="confirm_password" minlength="6" autocomplete="new-password" required />
      </label>
      <div id="registerError" class="form-error" hidden></div>
      <div id="registerSuccess" class="form-success" hidden></div>
      <button class="btn primary" type="submit">提交注册</button>
    </form>
    <p class="login-hint muted">已有账号？<a href="/login">返回登录</a></p>
  </main>
  <script src="/register.js"></script>
</body>
</html>
