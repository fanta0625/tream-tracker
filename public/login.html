<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · Team Tracker</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark">TT</span>
      <div>
        <strong>Team Tracker</strong>
        <span>团队工作追踪</span>
      </div>
    </div>
    <h1>登录</h1>
    <p class="muted">使用管理员分配的账号登录。</p>
    <form id="loginForm" class="form">
      <label>用户名
        <input name="username" autocomplete="username" required autofocus />
      </label>
      <label>密码
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <div id="loginError" class="form-error" hidden></div>
      <button class="btn primary" type="submit">登录</button>
    </form>
    <p class="login-hint muted">还没有账号？<a href="/register">邮箱注册</a>（需管理员审核）</p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
